appId: com.demo.full-editor
productName: Full Editor
directories:
  buildResources: build
  output: dist
files:
  - out/**
asar: true
npmRebuild: false
electronLanguages:
  - en
  - zh_CN
artifactName: ${name}-${version}-${arch}.${ext}
publish:
  provider: github
  owner: aches
  repo: full-editor
  releaseType: release
fileAssociations:
  - ext: md
    name: Markdown Document
    description: Markdown Document
    role: Editor
    rank: Alternate
  - ext: markdown
    name: Markdown Document
    description: Markdown Document
    role: Editor
    rank: Alternate
  - ext: mdown
    name: Markdown Document
    role: Editor
    rank: Alternate
  - ext: mkd
    name: Markdown Document
    role: Editor
    rank: Alternate
  - ext: mkdn
    name: Markdown Document
    role: Editor
    rank: Alternate
mac:
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  icon: build/icon.icns
  category: public.app-category.developer-tools
  identity: null
dmg:
  title: Full Editor
